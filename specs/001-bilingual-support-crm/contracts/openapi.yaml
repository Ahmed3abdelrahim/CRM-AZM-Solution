        channel: { type: string, enum: [web, email, whatsapp, sms, chat, portal] }
        from_identity: { type: string }
        to_identity: { type: string, description: "The receiving identifier — matched against channel_configs.identifier (FR-023a)." }
        subject: { type: string, nullable: true }
        body: { type: string }
        locale: { type: string, enum: [ar, en] }
