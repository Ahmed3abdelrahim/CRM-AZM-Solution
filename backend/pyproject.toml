[project]
name = "crm-backend"
version = "0.1.0"
description = "Bilingual Support CRM — backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<1.15",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "uvicorn[standard]>=0.32,<0.33",
    "arq>=0.26,<0.27",
    "httpx>=0.27,<0.29",
    "litellm>=1.95,<1.98",
    "passlib[argon2]",
    "pyjwt>=2.9,<3.0",
    "email-validator>=2.2,<3.0",
    "structlog",
    "asyncpg",
    "greenlet",
    "pgvector",
    "minio>=7.2,<7.3",
    "sentence-transformers>=3.0,<7.0",
    "python-multipart>=0.0.12,<0.1",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
